name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm validate:infra

  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cd infra
          POSTGRES_PASSWORD=dummy PAYSTACK_TEST_KEY=dummy docker compose -f docker-compose.dev.yml config > /dev/null
          POSTGRES_PASSWORD=dummy PAYSTACK_TEST_KEY=dummy docker compose -f docker-compose.staging.yml config > /dev/null
          POSTGRES_PASSWORD=dummy PAYSTACK_TEST_KEY=dummy docker compose -f docker-compose.prod.yml config > /dev/null

  compose-run:
    # Boots the real dev stack (Postgres + Redis + API) in Docker and hits it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @puremart/api build
      - run: cd infra && docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for healthy API
        run: |
          for i in $(seq 1 36); do
            curl -fsS http://localhost:3001/health && break || sleep 5
          done
          curl -fsS http://localhost:3001/health
      - run: curl -fsS -X POST http://localhost:3001/webhooks/paystack -H 'Content-Type: application/json' -d '{"event":"charge.success"}'
      - run: cd infra && docker compose -f docker-compose.dev.yml logs api
        if: failure()
      - run: cd infra && docker compose -f docker-compose.dev.yml down
        if: always()
